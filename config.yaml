area:
  name: "Panipat city"
  # Generous bounding box around the city: [min_lat, min_lon, max_lat, max_lon].
  # It includes the NH-44 stretch that runs through the city. Approximate: it also covers
  # some outskirts. For an exact boundary, draw a polygon at geojson.io and save it below.
  bbox: [29.34, 76.92, 29.44, 77.02]
  polygon_geojson: data/area.geojson       # optional Polygon(s); used instead of bbox if present
  highway_geojson: data/highway.geojson    # optional LineString: NH-44 beyond the polygon
  highway_buffer_m: 100
  tile_deg: 0.01                           # Mapillary query tile (~1 km); auto-splits if crowded

paths:
  db: data/pothole.db
  images: data/images
  outputs: outputs

detection:
  weights: models/best.pt
  conf: 0.35
  imgsz: 640
  min_y_frac: 0.45         # ignore boxes centred in the top of the frame (too far away)
  offset_m: 5              # pothole assumed this far ahead of the camera (narrow lanes: closer)

compare:
  cluster_radius_m: 8      # detections closer than this are the same pothole
  match_radius_m: 12       # baseline vs current match distance
  coverage_radius_m: 15    # "we had imagery here" distance
  min_hits: 2              # detections needed to trust a pothole (use 1 if lanes have sparse imagery)
